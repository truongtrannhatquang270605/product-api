services:
  mongodb:
    image: mongo:7
    container_name: nammongodb-prod
    volumes:
      - mongo_prod_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: quangtruong2706/product-api:latest
    container_name: product-api-prod
    pull_policy: always

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb

    depends_on:
      mongodb:
        condition: service_healthy

    restart: unless-stopped

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower-prod

    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      WATCHTOWER_POLL_INTERVAL: 30
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"

volumes:
  mongo_prod_data:
